global:
  scrape_interval:     15s 
  evaluation_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'jenkins'
    static_configs:
      - targets: ['192.168.111.201:9100']

  - job_name: 'docker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.111.202:9100']
      - targets: ['192.168.111.202:9323']